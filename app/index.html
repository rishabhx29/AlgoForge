<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlgoForge</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Preconnect to domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://algoforge-2-0.onrender.com">

    <!-- Load Google Fonts asynchronously via link tags instead of blocking CSS @import.
         DM Sans = body/UI face (Pattern Studio). Space Grotesk = display/headings.
         JetBrains Mono = code, test output, figures. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">

    <!-- Minimal inline skeleton CSS to prevent a white flash before index.css loads.
         Must match --af-ground (#19191b) or the flash is visible. -->
    <style>
      body, html {
        margin: 0;
        padding: 0;
        background-color: #19191b; /* --af-ground */
        color: #f1eeea;            /* --af-ink */
      }
      #root {
        min-height: 100vh;
        background-color: #19191b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
